<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web apisuta 🌸✨</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐰</text></svg>">

<script>
const ME = {
  github: "apisuta",
  name: "apisuta 🌸✨",
  role: "นักศึกษาวิศวกรรมคอมพิวเตอร์ ปี 2 · มทร.อีสาน 🐰🎀",
  tagline: "Coding with passion, coffee, and cute bunny magic! 💖✨",
  about: ""สวัสดีค่ะ ชื่อ อภิสุตา แสนวงศ์ นักศึกษาชั้นปีที่ 2 สาขาวิศวกรรมคอมพิวเตอร์ มหาวิทยาลัยเทคโนโลยีราชมงคลอีสาน วิทยาเขตขอนแก่น มีความสนใจเกี่ยวกับการพัฒนาเว็บไซต์และการเขียนโปรแกรม ยินดีที่ได้รู้จักทุกคนค่ะ" 🎀🐰✨",
  learning: [
    "🌸 HTML5 & CSS3 Advanced Styling",
    "🎀 JavaScript & React Web Development",
    "✨ Git & GitHub Workflow",
    "🍓 UI/UX Design & Aesthetic Animation"
  ],
  works: [],
  links: [
    { label: "🌸 GitHub Profile", url: "https://github.com/apisuta" },
    { label: "💖 Instagram", url: "https://instagram.com" },
  ],
  theme: "pink",
};
</script>

<style>
/* ---------- สีพื้นฐาน & เอฟเฟกต์ชมพูหวาน ---------- */
:root {
  --bg: #fff0f5;
  --line: #fbcfe8;
  --text: #701a75;
  --muted: #a21caf;
  --accent: #ec4899;
  --accent-soft: #f472b6;
  --surface: rgba(255, 255, 255, 0.82);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

*{ box-sizing:border-box }

body {
  margin:0; min-height:100vh; color:var(--text);
  font-family:"Segoe UI","Noto Sans Thai",system-ui,sans-serif;
  line-height:1.75;
  background:
    radial-gradient(1000px 460px at 12% -10%, #fdf2f8 0, transparent 60%),
    radial-gradient(820px 400px at 92% 0, #fce7f3 0, transparent 55%),
    var(--bg);
  overflow-x: hidden;
  position: relative;
}

/* ---------- เอฟเฟกต์ละอองดาวฟรุ้งฟริ้งลอยพื้นหลัง ---------- */
.sparkle-bg {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}

.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  box-shadow: 0 0 10px #f472b6, 0 0 20px #ec4899;
  animation: floatStar 4s infinite ease-in-out;
  opacity: 0.8;
}

@keyframes floatStar {
  0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
  50% { transform: translateY(-20px) scale(1.4); opacity: 1; }
}

.wrap { max-width:760px; margin:0 auto; padding:0 22px 80px; position: relative; z-index: 1; }

/* ---------- กระต่าย & เอฟเฟกต์ลอยวิ้งๆ ---------- */
.bunny-sticker {
  width: 250%;
  text-align: center;
  margin-top: 20px;
  margin-bottom: 10px;
  animation: bounce 3s ease-in-out infinite;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.bunny-sticker img {
  max-width: 500px;
  height: auto;
  filter: drop-shadow(0 8px 15px rgba(236, 72, 153, 0.3));
}

.hero{ display:flex; gap:22px; align-items:center; padding:30px 0 8px; flex-wrap:wrap; }

.avatar{
  width:96px; height:96px; border-radius:50%;
  border:3px solid var(--accent); object-fit:cover; flex-shrink:0;
  background:var(--surface);
  box-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
}

.avatar-fallback{
  width:96px; height:96px; border-radius:50%; flex-shrink:0;
  border:3px solid var(--accent); background:var(--surface);
  display:flex; align-items:center; justify-content:center;
  font-size:38px; font-weight:600; color:var(--accent);
  box-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
}

.hero-text{ flex:1; min-width:240px }
.role{
  font:600 13px/1 var(--mono); letter-spacing:.12em;
  text-transform:uppercase; color:var(--accent); margin:0 0 8px;
}
h1{ font-size:clamp(30px,6vw,44px); line-height:1.15; margin:0 0 8px; color:#86198f; text-shadow: 0 2px 10px rgba(244, 114, 182, 0.3); }
.tagline{ font-size:clamp(16px,2.5vw,19px); color:var(--text); margin:0; opacity:.92; font-weight:500; }

.about{
  color:var(--muted); margin:20px 0 0; max-width:62ch;
  background: var(--surface); padding: 18px 22px; border-radius: 20px;
  border: 2px solid var(--line);
  box-shadow: 0 8px 20px rgba(251, 207, 232, 0.5);
  backdrop-filter: blur(5px);
}

/* ---------- ปุ่มลิงก์ฟรุ้งฟริ้ง ---------- */
.links{ display:flex; flex-wrap:wrap; gap:10px; padding:0; margin:24px 0 0; list-style:none }
.links a{
  display:inline-block; border:1.5px solid var(--line); border-radius:999px;
  padding:10px 22px; color:var(--text); text-decoration:none; font-size:15px;
  background: rgba(255, 255, 255, 0.9);
  font-weight: 600;
  box-shadow: 0 4px 12px rgba(236, 72, 153, 0.15);
  transition:all .3s ease;
}
.links a:hover{
  border-color:var(--accent); color:#fff; background: var(--accent);
  transform: translateY(-3px) scale(1.03);
  box-shadow: 0 8px 20px rgba(236, 72, 153, 0.4);
}

section{ margin-top:44px }
h2{
  font:600 13px/1 var(--mono); letter-spacing:.16em; text-transform:uppercase;
  color:var(--accent); border-bottom:2px dashed var(--line);
  padding-bottom:10px; margin:0 0 20px;
}

.learning{ list-style:none; padding:0; margin:0 }
.learning li{
  border-left:4px solid var(--accent); padding:6px 0 6px 16px;
  margin-bottom:12px; color:var(--text);
  background: rgba(255, 255, 255, 0.7);
  border-radius: 0 14px 14px 0;
  box-shadow: 0 2px 8px rgba(251, 207, 232, 0.3);
}

.works{ display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)) }
.empty{
  border:2px dashed var(--line); border-radius:20px; padding:28px 20px;
  color:var(--muted); text-align:center; font-size:15px;
  background: rgba(255, 255, 255, 0.8);
}

.panel{ border:2px solid var(--line); border-radius:20px; background:var(--surface); padding:8px 20px 16px; box-shadow: 0 6px 16px rgba(251, 207, 232, 0.4); }
.row{ display:grid; grid-template-columns:minmax(130px,1fr) minmax(0,1.5fr); gap:12px; padding:11px 0; border-bottom:1px dashed var(--line); align-items:baseline; }
.row:last-of-type{ border-bottom:0 }
.row dt{ color:var(--muted); font-size:14px; margin:0; font-weight: 500; }
.row dd{ margin:0; font-family:var(--mono); font-size:14px; color:var(--accent); word-break:break-all; font-weight: 600; }
.row .note{ display:block; color:var(--muted); font-family:sans-serif; font-size:12.5px; font-weight: normal; }
.hint{ color:var(--muted); font-size:13.5px; margin:14px 0 0; text-align: center; }

footer{ margin-top:56px; padding-top:22px; border-top:2px dashed var(--line); color:var(--muted); font-size:14px; text-align: center; }
footer a{ color:var(--accent); font-weight: 600; text-decoration: none; }

@media (max-width:520px){
  .hero{ padding-top:20px; gap:16px }
  .avatar, .avatar-fallback{ width:76px; height:76px; font-size:28px }
  .row{ grid-template-columns:1fr; gap:2px }
  .bunny-sticker img { max-width: 140px; }
}
</style>
</head>
<body>

<!-- เลเยอร์ดาวฟรุ้งฟริ้ง -->
<div class="sparkle-bg" id="sparkleBg"></div>

<div class="wrap">

  <div class="bunny-sticker">
    <img src="https://i.pinimg.com/originals/13/14/6a/13146a408da0d95f39946b0fa8b1b24b.gif" alt="Cute Snowball Bunny GIF" />
  </div>

  <header class="hero">
    <img class="avatar" id="avatar" alt="" width="96" height="96">
    <div class="hero-text">
      <p class="role" id="role"></p>
      <h1 id="name"></h1>
      <p class="tagline" id="tagline"></p>
    </div>
  </header>
  <p class="about" id="about"></p>
  <ul class="links" id="links"></ul>

  <section>
    <h2>🌸 กำลังเรียนรู้ (Learning)</h2>
    <ul class="learning" id="learning"></ul>
  </section>

  <section>
    <h2>🎀 ผลงาน (Projects)</h2>
    <div class="works" id="works"></div>
  </section>

  <section>
    <h2>✨ ข้อมูลการเชื่อมต่อของหน้านี้</h2>
    <div class="panel">
      <dl id="netpanel"></dl>
      <p class="hint">กด F12 เลือกแท็บ Network แล้วกด Ctrl+F5 เพื่อเปรียบเทียบค่า</p>
    </div>
  </section>

  <footer>
    สร้างด้วย ❤️ HTML, CSS และ JavaScript · โฮสต์บน GitHub Pages ·
    <a id="repolink" href="https://github.com">ดูซอร์สโค้ดของหน้านี้ ↗</a>
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);

document.title = ME.name;
$('role').textContent    = ME.role;
$('name').textContent    = ME.name;
$('tagline').textContent = ME.tagline;
$('about').textContent   = ME.about;

const avatar = $('avatar');
avatar.alt = 'รูปโปรไฟล์ของ ' + ME.name;
avatar.addEventListener('error', () => {
  const box = document.createElement('div');
  box.className = 'avatar-fallback';
  box.textContent = (ME.name || '?').trim().charAt(0);
  avatar.replaceWith(box);
});
avatar.src = 'https://github.com/' + ME.github + '.png?size=192';

for (const item of ME.learning || []) {
  const li = document.createElement('li');
  li.textContent = item;
  $('learning').appendChild(li);
}

for (const link of ME.links || []) {
  const a = document.createElement('a');
  a.href = link.url;
  a.textContent = link.label;
  a.rel = 'noopener noreferrer';
  const li = document.createElement('li');
  li.appendChild(a);
  $('links').appendChild(li);
}

if (!ME.works || ME.works.length === 0) {
  const box = document.createElement('div');
  box.className = 'empty';
  box.textContent = '🎀 ยังไม่มีผลงานในหน้านี้ กำลังเรียนรู้อยู่ แล้วจะกลับมาเพิ่มเรื่อย ๆ นะคะ ✨';
  $('works').appendChild(box);
}

$('repolink').href = 'https://github.com/' + ME.github + '/' + ME.github + '.github.io';

/* ---------- สร้างละอองดาวฟรุ้งฟริ้งบนพื้นหลัง ---------- */
const sparkleBg = $('sparkleBg');
for (let i = 0; i < 30; i++) {
  const star = document.createElement('div');
  star.className = 'star';
  const size = Math.random() * 6 + 2 + 'px';
  star.style.width = size;
  star.style.height = size;
  star.style.top = Math.random() * 100 + '%';
  star.style.left = Math.random() * 100 + '%';
  star.style.animationDelay = Math.random() * 4 + 's';
  sparkleBg.appendChild(star);
}

/* ---------- เอฟเฟกต์ประกายวิ้งๆ ลอยตามเมาส์ ---------- */
document.addEventListener('mousemove', (e) => {
  if (Math.random() > 0.3) return; // ไม่ให้เยอะเกินไปจนบังตา
  const spark = document.createElement('div');
  spark.textContent = ['✨', '🌸', '💖', '⭐'][Math.floor(Math.random() * 4)];
  spark.style.position = 'fixed';
  spark.style.left = e.clientX + 'px';
  spark.style.top = e.clientY + 'px';
  spark.style.fontSize = Math.random() * 12 + 10 + 'px';
  spark.style.pointerEvents = 'none';
  spark.style.zIndex = '9999';
  spark.style.transition = 'all 0.8s ease-out';
  document.body.appendChild(spark);

  setTimeout(() => {
    spark.style.transform = `translate(${(Math.random()-0.5)*40}px, ${(Math.random()-0.5)*40 - 20}px) scale(0)`;
    spark.style.opacity = '0';
  }, 10);

  setTimeout(() => spark.remove(), 850);
});

/* Performance Data */
function ms(v) { return (typeof v !== 'number' || v < 0 || Number.isNaN(v)) ? '—' : Math.round(v) + ' ms'; }
window.addEventListener('load', () => setTimeout(() => {
  const nav = performance.getEntriesByType('navigation')[0];
  const rows = [
    ['Domain name', location.hostname || '(เปิดจากไฟล์ในเครื่อง)', 'ชื่อโดเมนต้องถูกแปลงเป็น IP address ผ่าน DNS ก่อน'],
    ['Protocol', location.protocol, 'https คือ HTTP ที่เพิ่มการเข้ารหัส'],
  ];
  if (nav) rows.push(
    ['DNS lookup', ms(nav.domainLookupEnd - nav.domainLookupStart), 'เวลาแปลงชื่อโดเมนเป็น IP'],
    ['Connection + TLS', ms(nav.connectEnd - nav.connectStart), 'เวลาสร้างการเชื่อมต่อ'],
    ['TTFB', ms(nav.responseStart - nav.requestStart), 'Time To First Byte'],
  );
  for (const [label, value, note] of rows) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<dt>${label}</dt><dd>${value}<span class="note">${note}</span></dd>`;
    $('netpanel').appendChild(row);
  }
}, 0));
</script>
</body>
</html>
